<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlyTaiko AI Web Player</title>
    <script src="vendor/jszip-3.10.1.min.js"></script>
    <style>
        :root {
            --don-color: #f05a5a;
            --kat-color: #5ab4f0;
            --bg-color: #2b2b2b;
            --lane-color: #1a1a1a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 20px;
        }

        .controls {
            background: #333;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .file-upload {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn:hover {
            background: #45a049;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #game-container {
            position: relative;
            width: 1000px;
            height: 300px;
            background: var(--lane-color);
            border: 4px solid #444;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
        }

        #hit-target {
            position: absolute;
            left: 150px;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            box-sizing: border-box;
            z-index: 10;
        }

        #keyboard {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .key {
            width: 60px;
            height: 60px;
            background: #444;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #888;
            transition: 0.1s;
        }

        .key.active-don {
            background: var(--don-color);
            color: white;
            transform: scale(0.95);
        }

        .key.active-kat {
            background: var(--kat-color);
            color: white;
            transform: scale(0.95);
        }

        #judgment-text {
            position: absolute;
            left: 150px;
            top: 30px;
            transform: translateX(-50%);
            font-size: 32px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.1s;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            z-index: 20;
        }

        #combo-text {
            position: absolute;
            left: 10px;
            bottom: 10px;
            font-size: 24px;
            font-weight: bold;
            color: #ffeb3b;
        }

        #stats-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            background: #333;
            padding: 15px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .stat-great {
            color: #21d6ef;
        }

        .stat-good {
            color: #49e900;
        }

        .stat-miss {
            color: #e5b43f;
        }

        .stat-acc {
            color: #fff;
            margin-left: 20px;
        }

        #ur-container {
            width: 400px;
            height: 30px;
            background: #222;
            margin-top: 20px;
            position: relative;
            border: 2px solid #555;
            border-radius: 5px;
            overflow: hidden;
        }

        #ur-center {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 3px;
            background: white;
            z-index: 5;
        }

        .ur-tick {
            position: absolute;
            width: 2px;
            height: 22px;
            background: rgba(255, 255, 255, 0.7);
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #ur-avg-arrow {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 10px solid #fff;
            transform: translateX(-50%);
            z-index: 10;
            transition: left 0.1s;
            display: none;
        }

        /* Recorded MaleCNS mode reuses the original taiko lane and HUD. */
        body.recorded-mode { background: #0b1018; padding: 20px; box-sizing: border-box; color: #c8d7e9; }
        body.recorded-mode h1 { display: none; }
        body.recorded-mode #game-container { width: 100%; max-width: 1000px; height: auto; aspect-ratio: 16 / 9; box-sizing: border-box; border-color: #2b4055; border-width: 2px; border-radius: 12px; }
        body.recorded-mode #game-canvas { display: block; width: 100%; height: 100%; }
        body.recorded-mode #hit-target { left: 15%; top: 26.6667%; width: 8%; height: auto; aspect-ratio: 1; }
        body.recorded-mode #judgment-text { left: 28%; top: 8%; font-size: clamp(14px, 3vw, 30px); }
        body.recorded-mode #combo-text { font-size: clamp(14px, 2vw, 24px); }
        body.recorded-mode #stats-container { flex-wrap: wrap; justify-content: center; gap: 10px 18px; font-size: 13px; padding: 12px; margin-top: 12px; border-radius: 9px; background: #121e2b; border: 1px solid #26384b; }
        body.recorded-mode .stat-acc { margin-left: 0; }
        body.recorded-mode #keyboard { margin-top: 12px; }
        body.recorded-mode .key { width: 46px; height: 42px; border-radius: 9px; background: #1b2a3b; border-color: #334961; }
        body.recorded-mode .key.active-don { background: var(--don-color); color: white; }
        body.recorded-mode .key.active-kat { background: var(--kat-color); color: white; }
        body.recorded-mode #ur-container { width: min(400px, 90%); margin-top: 12px; }
        body.recorded-mode.koishi-skin { background: #1b1421; }
        body.recorded-mode.koishi-skin #game-container { border-color: #7d5d9e; }
        body.recorded-mode.koishi-skin #hit-target { border-color: rgba(231, 207, 255, .9); box-shadow: 0 0 12px rgba(156, 93, 220, .35); }
    </style>
</head>

<body>

    <h1>FlyTaiko AI Web Player</h1>

    <div class="controls" style="display: none;">
        <div class="file-upload" id="diff-container" style="display: none;">
            <label>1.5. Select difficulty</label>
            <select id="diff-select"></select>
        </div>
        <div class="file-upload">
            <label>2. Select file <b>replay.json</b> (Fly brain)</label>
            <input type="file" id="replay-file" accept=".json">
        </div>
        <button id="start-btn" class="btn" disabled>PLAY</button>
    </div>

    <div id="game-container">
        <div id="hit-target"></div>
        <div id="judgment-text">GREAT</div>
        <div id="combo-text">0x</div>
        <canvas id="game-canvas" width="1000" height="300"></canvas>
    </div>

    <div id="keyboard">
        <div class="key" id="key-d">D</div>
        <div class="key" id="key-f">F</div>
        <div class="key" id="key-j">J</div>
        <div class="key" id="key-k">K</div>
    </div>

    <div id="stats-container">
        <div class="stat-great">Great: <span id="stat-great-val">0</span></div>
        <div class="stat-good">Good: <span id="stat-good-val">0</span></div>
        <div class="stat-miss">Miss: <span id="stat-miss-val">0</span></div>
        <div class="stat-acc">Acc: <span id="stat-acc-val">100.00%</span></div>
        <div class="stat-acc">Avg Error: <span id="stat-error-val">0ms</span></div>
    </div>

    <div id="ur-container">
        <div id="ur-avg-arrow"></div>
        <div id="ur-center"></div>
        <div id="ur-ticks"></div>
    </div>

    <script>
        let audioContext = new (window.AudioContext || window.webkitAudioContext)();
        let gainNode = audioContext.createGain();
        gainNode.connect(audioContext.destination);
        window.setVolume = function (v) { gainNode.gain.value = v; };

        // EXPOSED STATE FOR FLYSCENE
        window.taikoState = {
            isPlaying: false,
            audioContext: audioContext,
            startTime: 0,
            currentTimeMs: 0,
            replayActions: []
        };

        let beatmapNotes = [];
        let replayActions = [];
        let audioBuffer = null;
        let audioSource = null;
        let startTime = 0;
        let startAudioTime = 0;
        let isPlaying = false;
        let combo = 0;
        let countGreat = 0;
        let countGood = 0;
        let countMiss = 0;
        let urHistory = [];
        let globalSumOffset = 0;
        let globalCountOffset = 0;
        let zipCache = null;
        let allDiffs = [];

        const HIT_X = 150;
        const SPEED = 0.5; // pixels per ms

        // UI Elements
        const oszInput = document.getElementById('osz-file');
        const diffContainer = document.getElementById('diff-container');
        const diffSelect = document.getElementById('diff-select');
        const replayInput = document.getElementById('replay-file');
        const startBtn = document.getElementById('start-btn');
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const judgmentText = document.getElementById('judgment-text');
        const comboText = document.getElementById('combo-text');

        const keys = {
            'D': document.getElementById('key-d'),
            'F': document.getElementById('key-f'),
            'J': document.getElementById('key-j'),
            'K': document.getElementById('key-k')
        };

        // Check if both files are loaded
        function checkReady() {
            window.parent.postMessage({
                type: 'TAIKO_DEBUG',
                status: `Notes: ${beatmapNotes.length}, Replay: ${replayActions.length}, Audio: ${!!audioBuffer}`
            }, '*');

            if (beatmapNotes.length > 0 && replayActions.length > 0 && audioBuffer) {
                window.parent.postMessage({ type: 'TAIKO_READY' }, '*');
            }
        }

        function updateStatsUI() {
            document.getElementById('stat-great-val').textContent = countGreat;
            document.getElementById('stat-good-val').textContent = countGood;
            document.getElementById('stat-miss-val').textContent = countMiss;
            let total = countGreat + countGood + countMiss;
            let acc = total === 0 ? 100 : ((countGreat * 300 + countGood * 150) / (total * 300)) * 100;
            document.getElementById('stat-acc-val').textContent = acc.toFixed(2) + '%';
        }

        function addURTick(offset, color) {
            if (offset === null) return;
            urHistory.push({ offset, color });
            if (urHistory.length > 10) urHistory.shift();

            const container = document.getElementById('ur-ticks');
            container.innerHTML = ''; // Clear previous ticks

            let sumOffset = 0;

            urHistory.forEach(item => {
                const tick = document.createElement('div');
                tick.className = 'ur-tick';
                let pct = (item.offset + 150) / 300 * 100;
                pct = Math.max(0, Math.min(100, pct));
                tick.style.left = pct + '%';
                tick.style.backgroundColor = item.color;
                container.appendChild(tick);
                sumOffset += item.offset;
            });

            // Update average arrow
            const avgArrow = document.getElementById('ur-avg-arrow');
            if (urHistory.length > 0) {
                let avgOffset = sumOffset / urHistory.length;
                let avgPct = (avgOffset + 150) / 300 * 100;
                avgPct = Math.max(0, Math.min(100, avgPct));
                avgArrow.style.left = avgPct + '%';
                avgArrow.style.display = 'block';
            } else {
                avgArrow.style.display = 'none';
            }

            // Update Global Average Error Text
            globalSumOffset += offset;
            globalCountOffset += 1;
            let globalAvg = globalSumOffset / globalCountOffset;
            let sign = globalAvg > 0 ? '+' : '';
            document.getElementById('stat-error-val').textContent = sign + globalAvg.toFixed(1) + 'ms';
        }

        // EXPOSE UPLOAD METHODS
        window.loadReplay = function (file) {
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const data = JSON.parse(ev.target.result);
                replayActions = data.actions || [];
                window.taikoState.replayActions = replayActions;
                console.log(`Loaded ${replayActions.length} replay actions`);
                checkReady();
            };
            reader.readAsText(file);
        };

        window.loadOsz = async function (file) {
            if (!file) return;

            // startBtn.textContent = "Đang nén và xử lý OSZ...";
            // startBtn.disabled = true;
            zipCache = await JSZip.loadAsync(file);

            // Tìm TẤT CẢ các file .osu trong file .osz
            let osuFileNames = Object.keys(zipCache.files).filter(n => n.endsWith('.osu'));
            if (osuFileNames.length === 0) {
                alert("No .osu chart found in this .osz!");
                return;
            }

            allDiffs = [];
            for (let name of osuFileNames) {
                const text = await zipCache.files[name].async("string");
                const versionMatch = text.match(/Version:(.+)/);
                const version = versionMatch ? versionMatch[1].trim() : name;
                allDiffs.push({ name: name, version: version, text: text });
            }

            // Đưa vào dropdown cho user chọn (in React, but we can still populate here if needed, or just load diff 0)
            diffSelect.innerHTML = '';
            allDiffs.forEach((diff, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.textContent = diff.version;
                diffSelect.appendChild(opt);
            });

            window.parent.postMessage({ type: 'TAIKO_DIFFS', diffs: allDiffs.map(d => d.version) }, '*');

            // diffContainer.style.display = 'flex';

            // Tự động parse diff đầu tiên
            await window.loadDifficulty(0);
        };

        window.loadDifficulty = async function (index) {
            try {
                await internalLoadDifficulty(index);
            } catch (e) {
                window.parent.postMessage({ type: 'TAIKO_ERROR', message: e.toString() }, '*');
            }
        };

        // Khi user đổi độ khó trong dropdown
        diffSelect.addEventListener('change', async (e) => {
            await window.loadDifficulty(e.target.value);
        });

        async function internalLoadDifficulty(index) {
            const diff = allDiffs[index];
            const osuText = diff.text;

            // Trích xuất file Audio
            const audioMatch = osuText.match(/AudioFilename:\s*(.+)/);
            if (!audioMatch) {
                window.parent.postMessage({ type: 'TAIKO_ERROR', message: "No AudioFilename in .osu" }, '*');
                return;
            }
            const audioName = audioMatch[1].trim();

            // Tìm file bằng cách không phân biệt hoa thường
            const actualAudioName = Object.keys(zipCache.files).find(
                name => name.toLowerCase() === audioName.toLowerCase()
            );

            // Tải Audio nếu có
            if (actualAudioName) {
                // startBtn.textContent = "Đang load âm thanh...";
                try {
                    const audioData = await zipCache.files[actualAudioName].async("arraybuffer");
                    audioBuffer = await audioContext.decodeAudioData(audioData);
                } catch (e) {
                    window.parent.postMessage({ type: 'TAIKO_ERROR', message: "decodeAudioData error: " + e.toString() }, '*');
                    return;
                }
            } else {
                window.parent.postMessage({ type: 'TAIKO_ERROR', message: "Audio file not found in ZIP: " + audioName }, '*');
                return;
            }

            // Parse danh sách nốt nhạc (beatmapNotes)
            beatmapNotes = [];
            const lines = osuText.split('\n');
            let inHitObjects = false;

            for (let line of lines) {
                line = line.trim();
                if (line === '[HitObjects]') {
                    inHitObjects = true;
                    continue;
                }
                if (inHitObjects && line) {
                    const parts = line.split(',');
                    if (parts.length >= 5) {
                        const time = parseInt(parts[2]);
                        const type = parseInt(parts[3]);
                        const hitSound = parseInt(parts[4]);

                        // Circle only for now
                        if (type & 1) {
                            const isKat = (hitSound & 2) || (hitSound & 8);
                            const isBig = (hitSound & 4);
                            let nType = isKat ? 'kat' : 'don';
                            if (isBig) nType += '_big';
                            beatmapNotes.push({ time, type: nType, hit: false });
                        }
                    }
                }
            }
            console.log(`Loaded ${beatmapNotes.length} notes from diff ${diff.version}`);
            checkReady();
        }

        // Expose start game
        window.startGame = async function () {
            if (isPlaying) return;
            isPlaying = true;
            window.taikoState.isPlaying = true;
            combo = 0;
            countGreat = 0; countGood = 0; countMiss = 0;
            urHistory = [];
            globalSumOffset = 0; globalCountOffset = 0;
            document.getElementById('stat-error-val').textContent = '0ms';
            updateStatsUI();
            document.getElementById('ur-ticks').innerHTML = ''; // Clear UR bar
            document.getElementById('ur-avg-arrow').style.display = 'none';
            // startBtn.disabled = true;

            // Reset state
            beatmapNotes.forEach(n => n.hit = false);

            if (audioContext.state === 'suspended') await audioContext.resume();

            // Start audio
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            audioSource.connect(gainNode);

            // We give 2 seconds delay before song starts so notes can slide in
            const offsetMs = 2000;
            startTime = performance.now() + offsetMs;
            window.taikoState.startTime = startTime;

            // Audio is the master clock. Browser timers/background throttling
            // must not move gameplay ahead of the actual audio playback.
            startAudioTime = audioContext.currentTime + offsetMs / 1000;
            audioSource.start(startAudioTime);

            requestAnimationFrame(gameLoop);
        };

        let replayIndex = 0;
        const activeKeys = {};

        function showJudgment(text, color, offset = null) {
            judgmentText.textContent = text;
            judgmentText.style.color = color;
            judgmentText.style.opacity = 1;

            if (text === 'GREAT') { combo++; countGreat++; addURTick(offset, '#21d6ef'); }
            else if (text === 'GOOD') { combo++; countGood++; addURTick(offset, '#49e900'); }
            else { combo = 0; countMiss++; if (offset !== null) addURTick(offset, '#e5b43f'); }

            comboText.textContent = `${combo}x`;
            updateStatsUI();

            setTimeout(() => { judgmentText.style.opacity = 0; }, 300);
        }

        function gameLoop() {
            if (!isPlaying) return;

            const now = performance.now();
            const currentAudioTime = (audioContext.currentTime - startAudioTime) * 1000;
            window.taikoState.currentTimeMs = currentAudioTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Process Replay Actions
            while (replayIndex < replayActions.length && replayActions[replayIndex].time_ms <= currentAudioTime) {
                const act = replayActions[replayIndex];

                // Find nearest un-hit note to hide it and calculate UR offset
                let nearest = null;
                let minDist = 9999;
                for (let n of beatmapNotes) {
                    if (!n.hit && n.time > act.time_ms - 200 && n.time < act.time_ms + 200) {
                        let d = Math.abs(n.time - act.time_ms);
                        if (d < minDist) { minDist = d; nearest = n; }
                    }
                }

                let offset = 0;
                if (nearest) {
                    offset = act.time_ms - nearest.time; // < 0 is early, > 0 is late
                    if (act.judgment !== 'miss' || act.action !== 'NONE') nearest.hit = true;
                }

                // Show judgment
                if (act.judgment === 'great') showJudgment('GREAT', '#21d6ef', offset);
                else if (act.judgment === 'good') showJudgment('GOOD', '#49e900', offset);
                else if (act.judgment === 'miss') showJudgment('MISS', '#e5b43f', offset);

                // Animate keys
                if (act.action !== 'NONE') {
                    const keysPressed = act.action.split('+');
                    keysPressed.forEach(k => {
                        if (keys[k]) {
                            const isKat = (k === 'D' || k === 'K');
                            keys[k].classList.add(isKat ? 'active-kat' : 'active-don');
                            setTimeout(() => {
                                keys[k].classList.remove('active-kat', 'active-don');
                            }, 100);
                        }
                    });
                }
                replayIndex++;
            }

            // 2. Draw Notes
            for (let i = beatmapNotes.length - 1; i >= 0; i--) {
                let note = beatmapNotes[i];
                if (note.hit) continue;

                // If passed far left, mark as miss if replay didn't handle it
                if (note.time < currentAudioTime - 200) {
                    note.hit = true;
                    showJudgment('MISS', '#e5b43f', null);
                    continue;
                }

                const x = HIT_X + (note.time - currentAudioTime) * SPEED;

                // Only draw if visible
                if (x > -100 && x < canvas.width + 100) {
                    const isBig = note.type.includes('big');
                    const isKat = note.type.includes('kat');
                    const radius = isBig ? 45 : 30;

                    ctx.beginPath();
                    ctx.arc(x, 150, radius, 0, Math.PI * 2);
                    ctx.fillStyle = isKat ? '#5ab4f0' : '#f05a5a';
                    ctx.fill();

                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                }
            }

            if (currentAudioTime < audioBuffer.duration * 1000 + 3000) {
                requestAnimationFrame(gameLoop);
            } else {
                isPlaying = false;
                startBtn.disabled = false;
                startBtn.textContent = "REPLAY";
                replayIndex = 0;
            }
        }
    </script>
    <script src="recorded_taiko_player.js?v=skin-layout-3"></script>
</body>

</html>
